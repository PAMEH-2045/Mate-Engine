name: Check Upstream, Sync and Trigger Build

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  get_upstream_release:
    name: Getting latest upstream release
    runs-on: ubuntu-latest
    outputs:
      LATEST: ${{ steps.get_latest.outputs.LATEST }}
      
    steps:
      - name: Get release
        id: get_latest
        run: |
          LATEST=$(curl -s https://api.github.com/repos/shinyflvre/Mate-Engine/releases/latest | jq -r '.tag_name')
          echo "LATEST=$LATEST" >> $GITHUB_OUTPUT
          
  update_tag:
    name: Updating tag
    needs: get_upstream_release
    if: ${{ vars.STORED_ME_RELEASE != needs.get_upstream_release.outputs.LATEST && needs.get_upstream_release.outputs.LATEST != 'null' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Update STORED_ME_RELEASE
        env:
           GITHUB_TOKEN: ${{ secrets.MEFORK_PHYSBONE_WRITE_VARS_TOKEN }}
           LATEST: ${{ needs.get_upstream_release.outputs.LATEST }}
        run: gh variable set STORED_ME_RELEASE --body "$LATEST" 

  sync_upstream:
    name: Syncing with upstream
    needs: update_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: thiagokokada/merge-upstream@v1.0.2
        with:
          branch: main

  trigger_build:
    name: Triggering build
    needs: sync_upstream
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Build Action
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: build_trigger

